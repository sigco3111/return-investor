<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리턴: 회귀 투자자 (시제품)</title>
<style>
  :root { --ink:#251f21; --ink2:#585254; --line:#eae9ea; --teal:#73a89a; --bg:#f4efec; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Pretendard', sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  header { padding: 12px 0 20px; }
  header h1 { font-size: 20px; }
  header p { color: var(--ink2); font-size: 13px; }
  .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .card .date { color: var(--ink2); font-size: 13px; }
  .card h2 { font-size: 17px; margin: 4px 0 10px; }
  .card p { font-size: 14.5px; }
  .source-details { margin-top:12px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:13px; color:var(--ink2); }
  .source-details summary { cursor:pointer; color:var(--ink); }
  .source-details ul { padding-left:18px; margin:8px 0; }
  .source-details li { margin-bottom:5px; }
  .source-details p { font-size:12px; }
  .tags { margin-top: 10px; font-size: 12px; color: var(--ink2); }
  .choices button { display: block; width: 100%; text-align: left; padding: 14px 16px; margin-top: 8px;
    border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: 14.5px; cursor: pointer; }
  .choices button:active { border-color: var(--teal); }
  #portfolio { font-size: 13.5px; }
  #portfolio .row, #turn-card .row { display: flex; justify-content: space-between; padding: 4px 0; gap: 12px; }
  #portfolio .row > span:first-child { min-width:72px; flex-shrink:0; }
  #portfolio .row > :last-child { min-width:0; overflow-wrap:anywhere; }
  .asset-review .row { display:grid; grid-template-columns:minmax(0,1fr) max-content; gap:8px; align-items:start; }
  .asset-review .row > span:first-child { min-width:0; overflow-wrap:anywhere; }
  .asset-review .row > strong { white-space:nowrap; text-align:right; font-variant-numeric:tabular-nums; }
  .product-list { padding:8px 0; border-bottom:1px solid var(--line); }
  .product-list ul { padding-left:18px; }
  #portfolio .row { border-bottom: 1px solid var(--line); }
  #portfolio .row.market-share { flex-direction: column; gap: 3px; }
  #portfolio .row.market-share > span:first-child { min-width: 0; flex-shrink: 1; overflow-wrap: anywhere; }
  #portfolio .row.pending-order { align-items: flex-start; }
  #portfolio .row.pending-order > span:first-child, #portfolio .row.pending-hint > span:first-child { min-width: 0; flex: 1 1 0; overflow-wrap: anywhere; }
  #portfolio .row.pending-order > button { flex: 0 0 auto; }
  #turn-card .row span:first-child { flex-shrink: 0; }
  #turn-card .row strong, #turn-card .row span:last-child { text-align: right; }
  .muted { color: var(--ink2); font-size: 12.5px; }
  .unlock-banner { background: var(--teal); color: #fff; border-radius: 8px; padding: 10px 14px; font-size: 13.5px; margin-bottom: 14px; }
  /* VN 분리 레이어 [구조 시연 — 에셋 미제작, 1차 기획: 통이미지 금지·배경/인물/UI 분리 재조합] */
  .vn-stage { position: relative; height: 260px; border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
  .vn-bg { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: flex-start; padding: 8px 12px;
    background: url('assets/bg-classroom-ps1.png') center/cover; color: rgba(255,255,255,.75); font-size: 11.5px; }
  .vn-stage[data-scene="danger"] .vn-bg { filter: brightness(.55) saturate(.7); }
  .vn-stage[data-scene="life"] .vn-bg { filter: sepia(.25) brightness(1.02); }
  .vn-char { position: absolute; right: 18px; bottom: 0; height: 78%; max-height: 340px; filter: drop-shadow(2px 3px 3px rgba(0,0,0,.35)); }
  .vn-char img { height: 100%; display: block; }
  .vn-scene-label { position: absolute; left: 12px; bottom: 8px; color: rgba(255,255,255,.65); font-size: 11.5px; }
.life-record-assets{display:block!important}.life-record-assets strong{display:block;margin-top:6px}
.life-comparison{padding:16px 0;border-bottom:2px solid var(--line);margin-bottom:16px}.life-comparison h3,.life-comparison h4{margin:12px 0 6px}.selected-life{margin:12px 0;padding:10px;border:1px solid var(--line);border-radius:8px}.life-select,#life-selection-clear{min-height:44px;display:block;width:100%;padding:10px;margin:10px 0;border:1px solid var(--line);border-radius:8px;background:#fff;text-align:left;cursor:pointer}.life-select[aria-pressed="true"]{border-color:var(--teal);background:#edf5f1}.life-select:disabled,#life-selection-clear:disabled{color:#777;cursor:not-allowed}.life-difference .row{display:grid!important;grid-template-columns:minmax(0,1fr) max-content;gap:8px!important}.life-difference .row span{min-width:0;white-space:normal;overflow-wrap:anywhere}.life-difference .row strong{white-space:nowrap}.life-select:focus-visible,#life-selection-clear:focus-visible{outline:3px solid #127b9c;outline-offset:2px}
  .active-decision-review { margin:16px 0; padding:14px; border:1px solid var(--line); border-radius:8px; overflow-wrap:anywhere; }
  .active-decision-review h3 { font-size:16px; }
  .active-decision-review h4 { font-size:14px; margin:10px 0 6px; }
  .active-decision-review select { display:block; width:100%; min-height:44px; margin:8px 0; }
  .active-decision-review summary { cursor:pointer; min-height:44px; padding:8px 0; }
  .decision-month { display:grid; grid-template-columns:minmax(0,1fr); gap:8px; border-top:1px solid var(--line); padding:12px 0; }
  .decision-month h4 { grid-column:1/-1; }
  .decision-month ol { padding-left:22px; font-size:13px; }
  @media (min-width:600px) { .decision-month { grid-template-columns:repeat(2,minmax(0,1fr)); } }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="game-title">리턴: 회귀 투자자</h1>
    <p>시제품 · 실행 구간 1996-03~2026-10 · 뉴스 데이터는 1996~2026 부분 확보(연도별 공백 보충 중) · 시세는 검증된 지점만 · 시연용 설정(시드 100만원, 최종 설정 아님)</p>
  </header>
  <div class="vn-stage" id="vn-stage" data-scene="news">
    <div class="vn-bg"></div>
    <div class="vn-char"><img src="assets/char-student.png" alt="주인공 스탠딩"></div>
    <div class="vn-scene-label" id="vn-scene-label"></div>
  </div>
  <div id="unlock-area"></div>
  <section id="turn-card" class="card"></section>
  <section class="choices" id="choices"></section>
  <section id="portfolio" class="card"></section>
  <p class="muted" id="footnote"></p>
  <p class="muted"><a href="etf-observation-lab.html">실제ETF 관측·주문준비 실험 (본게임 저장과 분리)</a></p>
</main>
<script src="economy-policy.js"></script>
<script src="asset-review.js"></script>
<script src="school-calendar.js"></script>
<script src="engine.js"></script>
</body>
</html>
