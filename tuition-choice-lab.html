<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학비·현금부족 선택 실험</title>
<style>
:root{font-family:system-ui,sans-serif;color:#251f21;background:#f4efec;font-size:16px;line-height:1.65}*{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:720px;margin:auto}h1{font-size:27px;line-height:1.35}h2{font-size:21px}section,aside{background:white;border-radius:16px;padding:20px;margin:18px 0}p{margin:12px 0}.tag{font-size:14px;font-weight:700;color:#4c655d}.warning{border-left:4px solid #7b796f;padding-left:12px}.fact{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:8px 0;border-bottom:1px solid #eae9ea}.fact strong{white-space:nowrap}button{display:block;width:100%;min-height:48px;margin-top:12px;padding:12px;font:inherit;font-weight:600;text-align:left;border:1px solid #c6c4c0;border-radius:8px;background:#fff;color:#251f21;cursor:pointer}button.primary{background:#315f50;color:white;border-color:#315f50}button:disabled{color:#7e7976;background:#eee;cursor:not-allowed}button:focus-visible{outline:3px solid #127b9c;outline-offset:3px}.choices{display:grid;gap:12px}.muted{font-size:14px;color:#585254}.log{padding-left:20px}dialog{max-width:460px;width:calc(100% - 32px);border:0;border-radius:16px;padding:24px;color:#251f21}dialog::backdrop{background:#0008}dialog h2{margin-top:0}@media(max-width:359px){body{padding:12px}section,aside{padding:16px}.fact{grid-template-columns:1fr;gap:2px}.fact strong{text-align:right}}
</style>
<main><p class="tag">독립 설계 실험 · 본게임 미연결</p><h1>학비를 내기 전에<br>현금이 충분한지 확인해요</h1><aside><strong>모든 금액은 임의 시험값이에요.</strong><p>학교·연도·실제 급여·실제 학비를 재현하지 않아요. 공부와 알바의 현실적 우열을 뜻하지 않아요. 기존 게임의 순저축·이자·저장을 읽거나 바꾸지 않아요.</p><p class="muted">이 화면은 저장하지 않아요. 새로고침하면 처음으로 돌아가요.</p></aside><div id="app" aria-live="polite"></div><dialog id="confirm"><h2 id="confirm-title"></h2><p id="confirm-body"></p><button id="confirm-yes" class="primary">확인하고 실행</button><button id="confirm-no">취소하고 돌아가기</button></dialog></main>
<script>
'use strict';
const fmt=n=>new Intl.NumberFormat('ko-KR').format(n)+'원';
const assumptions={opening:600000,livingPerRound:100000,income:{study:0,work:300000},bill:800000,reservation:300000,rounds:2};
let previous=null;
let state={stage:'intro',path:null,round:0,cash:assumptions.opening,reserved:0,income:0,living:0,paid:0,studyRounds:0,workRounds:0,log:[]};
const app=document.querySelector('#app'),dialog=document.querySelector('#confirm');let nextAction=null,priorFocus=null;
const fact=(label,value)=>`<div class="fact"><span>${label}</span><strong>${value}</strong></div>`;
function ask(title,body,fn){priorFocus=document.activeElement;nextAction=fn;document.querySelector('#confirm-title').textContent=title;document.querySelector('#confirm-body').textContent=body;dialog.showModal();document.querySelector('#confirm-no').focus()}
function cancel(){nextAction=null;dialog.close();priorFocus?.focus()}
document.querySelector('#confirm-no').onclick=cancel;dialog.addEventListener('cancel',e=>{e.preventDefault();cancel()});
document.querySelector('#confirm-yes').onclick=()=>{const fn=nextAction;nextAction=null;dialog.close();if(fn)fn()};
function bind(id,fn){const el=document.getElementById(id);if(el)el.onclick=fn}
function render(){
 if(state.stage==='intro'){
 app.innerHTML=`${previous?'<aside><strong>직전 결과를 이번 실험과 비교할 준비가 됐어요.</strong><p>같은 시작자금·임의 시험값으로 다시 골라 보세요. 새로고침하면 비교대상도 사라져요.</p></aside>':''}<section><h2>두 회차를 같은 선택으로 보낼 때</h2>${fact('시험 시작자금',fmt(assumptions.opening))}${fact('회차마다 시험 생활지출',fmt(assumptions.livingPerRound))}${fact('진행할 시험 회차','2회')}${fact('한 번의 가상 청구',fmt(assumptions.bill))}<p>예약금 없이 두 회차를 같은 선택으로 보냈을 때예요. 회차마다 공부·알바를 바꿀 수 있고, 그때 현금 결과도 달라져요.</p><div class="choices"><div><h3>공부 경로 [시험 가정]</h3>${fact('회차마다 시험 수입','0원')}${fact('납부 직전 현금','400,000원')}${fact('청구액 대비 부족','400,000원')}<button id="study">공부로 첫 회차 준비</button></div><div><h3>알바 경로 [시험 가정]</h3>${fact('회차마다 시험 수입','300,000원')}${fact('납부 직전 현금','1,000,000원')}${fact('납부 후 현금','200,000원')}<button id="work">알바로 첫 회차 준비</button></div></div></section>`;
 for(const path of ['study','work'])bind(path,()=>ask('시험 경로를 시작할까요?',`${path==='study'?'공부':'알바'} 로 첫 회차를 준비해요. 회차별로 바꿀 수 있고 진행 버튼을 눌러야 수입·생활지출을 반영해요. 공부 선택 회차와 알바 선택 회차를 따로 기록하되 학습성과를 추정하지 않아요.`,()=>{state.path=path;state.stage='round';render()}));return;
 }
 const resources=`${fact('사용가능 시험 현금',fmt(state.cash))}${fact('별도 시험 예약금',fmt(state.reserved))}${fact('총시험자금',fmt(state.cash+state.reserved))}`;
 let content=`<section><h2>${state.path==='study'?'공부':'알바'} 선택 중 · ${state.round}/2회차 진행</h2>${resources}`;
 if(state.stage==='round')content+=`<p>다음 회차에 시험 수입 ${fmt(assumptions.income[state.path])}, 생활지출 ${fmt(assumptions.livingPerRound)}을 각각 반영해요. 진행 후 현금은 ${fmt(state.cash+assumptions.income[state.path]-assumptions.livingPerRound)}이에요. 가상 청구80만원은 두 회차 뒤 한 번만 와요.</p><button id="next" class="primary">${state.path==='study'?'공부':'알바'}로 이번 회차 진행</button><button id="switch">이번 회차를 ${state.path==='study'?'알바':'공부'}로 바꾸기</button><p class="muted">한 회차에 하나만 택해요. 회차 수는 시간배분 기록이지 성적·취업확률 점수가 아니에요.</p>`;
 if(state.stage==='bill'){
 const short=Math.max(0,assumptions.bill-state.cash);
 content+=`<h3>가상 청구 · 800,000원</h3>${fact('지금 부족한 사용가능 현금',fmt(short))}<p class="warning">${short?'현금이 부족해 지금은 납부할 수 없어요.':'납부하면 사용가능 현금 '+fmt(state.cash-assumptions.bill)+'이 남아요.'} 예약금은 사용가능 현금이 아니에요. 자동대출·자동매도·가족송금은 없어요.</p><button id="pay" class="primary" ${short?'disabled':''}>800,000원 본인 납부 ${short?'(현금 부족)':''}</button>${state.reserved?'<button id="release">시험 예약금 해제 검토</button>':'<button id="reserve" '+(state.cash<assumptions.reservation?'disabled':'')+'>300,000원 시험 예약금 따로 잡기</button>'}<p class="muted">예약금은 실제 상품이나 매매 주문이 아니에요. 현금/예약 구분을 읽는 연습용이며 언제든 명시적으로 해제할 수 있어요.</p><button id="defer">이번 납부를 보류하고 실험 종료</button><p class="muted">보류는 입학연기·휴학·차기 등록을 보장하지 않아요. 실제 학적 결과와 다음 생활은 미구현이에요.</p>`;
 }
 if(state.stage==='done')content+=`<h3>${state.paid?'가상 납부 완료':'가상 납부 보류'}</h3><p>${state.paid?'청구는 한 번만 차감했어요.':'현금은 차감하지 않았어요. 실제 진학시점이나 학적 결과는 정하지 않았어요.'}</p><h3>내가 고른 두 회차</h3>${fact('공부를 고른 회차',state.studyRounds+'회')}${fact('알바를 고른 회차',state.workRounds+'회')}<p>공부를 고르면 그 회차의 시험 알바 수입을 받지 않고, 알바를 고르면 그 회차를 공부 선택으로 세지 않아요. 실제 공부시간·성적·취업 결과를 나타내지는 않아요.</p><h3>시험 자금 복기</h3>${fact('시작자금',fmt(assumptions.opening))}${fact('누적 시험 수입','+'+fmt(state.income))}${fact('누적 시험 생활지출','-'+fmt(state.living))}${fact('본인 가상 납부','-'+fmt(state.paid))}${fact('남은 총시험자금',fmt(state.cash+state.reserved))}<p>현금과 예약금의 합계예요. 투자수익·수익률이 아니며 본게임 회귀기록에 저장하지 않아요.</p><button id="compare-next" class="primary">이 결과를 남기고 다른 선택 실험</button><button id="restart">비교 없이 처음부터 다시 실험</button>`;
 if(state.stage==='done'&&previous){
  const result=(x,label)=>`<h3>${label}</h3>${fact('공부 / 알바 선택',x.studyRounds+'회 / '+x.workRounds+'회')}${fact('납부 전 총시험자금',fmt(assumptions.opening+x.income-x.living))}${fact('본인 가상 납부',fmt(x.paid))}${fact('미납 가상 청구액',fmt(assumptions.bill-x.paid))}${fact('남은 사용가능 시험 현금',fmt(x.cash))}${fact('남은 시험 예약금',fmt(x.reserved))}${fact('남은 총시험자금',fmt(x.cash+x.reserved))}`;
  content+=`<h2>같은 조건, 내가 고른 두 결과</h2><p>시작자금60만원·두 회차 생활지출20만원·가상청구80만원은 같아요. 납부 전 자금과 납부 여부를 함께 보세요.</p>${result(previous,'직전 실험')}${result(state,'이번 실험')}<p class="muted">서로 다른 실제 인생을 비교한 것이 아니라 같은 임의값으로 직접 고른 두 실험이에요. 다음 실험에는 이번 결과 하나만 비교대상으로 남겨요.</p>`;
 }
 content+='</section><section><h2>이 실험의 기록</h2><ol class="log">'+state.log.map(x=>'<li>'+x+'</li>').join('')+'</ol></section>';app.innerHTML=content;
 bind('switch',()=>{const target=state.path==='study'?'work':'study';ask('이번 회차 선택을 바꿀까요?',`${target==='study'?'공부':'알바'} 선택으로 바꿔요. 진행하면 시험수입 ${fmt(assumptions.income[target])}, 생활지출 ${fmt(assumptions.livingPerRound)}, 현금 ${fmt(state.cash+assumptions.income[target]-assumptions.livingPerRound)}이에요. 지금은 선택만 바꾸고 돈은 아직 움직이지 않아요.`,()=>{if(state.stage!=='round')return;state.path=target;render()})});
 bind('next',()=>{if(state.stage!=='round')return;const i=assumptions.income[state.path],l=assumptions.livingPerRound;state.cash+=i-l;state.income+=i;state.living+=l;state.round++;if(state.path==='study')state.studyRounds++;else state.workRounds++;state.log.push(`${state.round}회차 ${state.path==='study'?'공부':'알바'} 선택: 시험수입 ${fmt(i)} / 생활지출 ${fmt(l)}`);if(state.round===2)state.stage='bill';render()});
 bind('reserve',()=>ask('시험 예약금을 잡을까요?','현금300,000원을 별도로 묶어요. 총시험자금은 같지만 납부에 쓸 현금은 줄어요. 실제 상품이나 주문은 아니에요.',()=>{if(state.stage!=='bill'||state.reserved||state.cash<assumptions.reservation)return;state.cash-=assumptions.reservation;state.reserved=assumptions.reservation;state.log.push('시험 예약금300,000원 별도 설정');render()}));
 bind('release',()=>ask('시험 예약금을 해제할까요?',`${fmt(state.reserved)}을 사용가능 현금으로 옮겨요. 수입이나 납부가 아니고 총시험자금은 같아요.`,()=>{if(state.stage!=='bill'||!state.reserved)return;state.cash+=state.reserved;state.reserved=0;state.log.push('시험 예약금 명시 해제');render()}));
 bind('pay',()=>ask('800,000원을 가상 납부할까요?',`사용가능 현금 ${fmt(state.cash)}에서800,000원을 한 번 차감해요. 납부 뒤 현금은${fmt(state.cash-assumptions.bill)}이에요.`,()=>{if(state.stage!=='bill'||state.cash<assumptions.bill)return;state.cash-=assumptions.bill;state.paid=assumptions.bill;state.stage='done';state.log.push('본인 가상 납부800,000원');render()}));
 bind('defer',()=>ask('납부를 보류하고 실험을 끝낼까요?','현금과 예약금은 그대로 남고 학적 결과는 미확정으로 끝나요. 불이익이 없다는 뜻이나 실제 진학연기 승인이 아니에요.',()=>{if(state.stage!=='bill')return;state.stage='done';state.log.push('가상 납부 보류, 학적 결과 미확정');render()}));
 bind('compare-next',()=>ask('이번 결과를 남기고 다시 고를까요?','지금 결과 하나를 메모리에만 남겨요. 같은 임의 시험값으로 다음 실험을 시작하고 두 결과를 함께 보여줘요. 기존 게임과 연결하거나 저장하지 않아요.',()=>{if(state.stage!=='done')return;previous={...state,log:[...state.log]};state={stage:'intro',path:null,round:0,cash:assumptions.opening,reserved:0,income:0,living:0,paid:0,studyRounds:0,workRounds:0,log:[]};render()}));
 bind('restart',()=>ask('실험을 처음부터 다시 할까요?','이 화면의 현재 결과와 비교대상만 지워요. 기존 게임 저장은 읽거나 바꾸지 않아요.',()=>{previous=null;state={stage:'intro',path:null,round:0,cash:assumptions.opening,reserved:0,income:0,living:0,paid:0,studyRounds:0,workRounds:0,log:[]};render()}));
}
render();
</script></html>
